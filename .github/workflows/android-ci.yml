name: Android Java XML CI
on:
  push:
    branches: [master, design/recime-kinetic-kitchen-2026]
  pull_request:
    branches: [master]

jobs:
  backend-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: python -m pip install -r backend/requirements.txt
      - name: Auth, sync, provider mocks and health contracts
        run: python -m unittest backend.test_cloud backend.test_health backend.test_provider_contracts backend.test_image_import -v
  android-build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - name: Install Android API 37
        run: |
          SDKMANAGER="$(find "${ANDROID_HOME:-/usr/local/lib/android/sdk}/cmdline-tools" -type f -name sdkmanager | sort -V | tail -1)"
          test -n "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" --install "platforms;android-37.0" "build-tools;37.0.0"
      - name: Check backend Python syntax
        run: python3 -m py_compile backend/app.py backend/test_backend.py
      - name: Build, unit tests and lint
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug assembleDebugAndroidTest testDebugUnitTest lintDebug
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: recime-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
